org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft. 26.1+ ships unobfuscated: Loom neither remaps Minecraft nor remaps our jar,
# and Yarn no longer exists. Only Mojang (vanilla) names are usable here.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.18.2

mod_version=1.0.0
maven_group=dev.pseudohat
archives_base_name=pseudohat

java_version=25

# Optional soft dependency (Modrinth maven) and the fabric-api version geckolib
# hard-requires, used by the dev client run.
geckolib_version=5.5.5
fabric_api_version=0.161.0+26.2

fabric.loom.disableObfuscation=true
